<!-- Modal backdrop -->
<div class="modal-backdrop" (click)="close()" role="presentation" aria-hidden="true"></div>

<div class="modal" role="dialog" [attr.aria-label]="isEdit ? 'Edit venue' : 'Create venue'" aria-modal="true">
  <!-- Header -->
  <div class="modal__header">
    <h2 class="modal__title">
      <span class="modal__title-icon" aria-hidden="true">🏛️</span>
      {{ isEdit ? 'Edit Venue' : 'New Venue' }}
    </h2>
    <button class="modal__close" type="button" (click)="close()" id="venue-form-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <form class="modal__body" (ngSubmit)="submit()" #f="ngForm" novalidate>

    <!-- Name -->
    <div class="field">
      <label class="field__label" for="venue-name">Venue Name *</label>
      <input
        id="venue-name"
        class="field__input"
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="e.g. The Grand Amphitheatre"
        autocomplete="off"
        required
      />
    </div>

    <!-- Address -->
    <div class="field">
      <label class="field__label" for="venue-address">Address *</label>
      <textarea
        id="venue-address"
        class="field__input field__textarea"
        [(ngModel)]="address"
        name="address"
        placeholder="Full venue address…"
        rows="3"
        required
      ></textarea>
    </div>

    <!-- Display Image -->
    <div class="field">
      <label class="field__label">Display Image</label>
      <app-image-upload
        [currentUrl]="display_image || null"
        (imageUrl)="onImageUrl($event)"
      />
    </div>

    <!-- Error -->
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <!-- Actions -->
    <div class="modal__actions">
      <button type="button" class="btn-ghost" (click)="close()" id="venue-form-cancel">Cancel</button>
      <button
        type="submit"
        class="btn-primary"
        id="venue-form-submit"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          <span class="spinner-sm" aria-hidden="true"></span>
        }
        {{ submitting() ? 'Saving…' : (isEdit ? 'Save Changes' : 'Create Venue') }}
      </button>
    </div>
  </form>
</div>
