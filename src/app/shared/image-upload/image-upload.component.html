<div
  class="upload-zone"
  [class.upload-zone--dragging]="isDragging()"
  [class.upload-zone--has-image]="!!preview()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  aria-label="Image upload zone"
>
  @if (preview()) {
    <div class="upload-zone__preview">
      <img [src]="preview()" alt="Preview" class="upload-zone__img" />
      <div class="upload-zone__overlay">
        <button type="button" class="overlay-btn" (click)="clearImage()" aria-label="Remove image">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Remove
        </button>
        <label class="overlay-btn overlay-btn--change" for="file-input-change" aria-label="Change image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 16l4-4 4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Change
        </label>
        <input id="file-input-change" type="file" accept="image/*" class="sr-only" (change)="onFileSelect($event)" />
      </div>

      @if (uploading()) {
        <div class="upload-zone__spinner-overlay" aria-live="polite" aria-busy="true">
          <span class="spinner"></span>
          <span class="upload-zone__uploading-text">Uploading…</span>
        </div>
      }
    </div>
  } @else {
    <label class="upload-zone__placeholder" for="file-input-new">
      <div class="upload-zone__icon" aria-hidden="true">
        @if (uploading()) {
          <span class="spinner spinner--large"></span>
        } @else {
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        }
      </div>
      <p class="upload-zone__title">
        {{ uploading() ? 'Uploading image…' : 'Drag & drop or click to upload' }}
      </p>
      <p class="upload-zone__hint">PNG, JPG, WEBP — up to 10 MB</p>
      <input id="file-input-new" type="file" accept="image/*" class="sr-only" (change)="onFileSelect($event)" [disabled]="uploading()" />
    </label>
  }
</div>

@if (error()) {
  <p class="upload-error" role="alert">{{ error() }}</p>
}
